# Render injects PORT; falls back to 8080 locally
server.port=${PORT:8080}

# SET THIS in Render's Environment tab. The default only exists for local testing.
host.secret=${HOST_SECRET:$idharth123}

# Max players allowed in one game
game.max-players=${MAX_PLAYERS:30}

# Allowed WebSocket origins. "*" is fine for a one-day event; set to your
# https://your-app.onrender.com URL to lock it down.
game.allowed-origins=${ALLOWED_ORIGINS:*}

spring.mvc.log-resolved-exception=false
